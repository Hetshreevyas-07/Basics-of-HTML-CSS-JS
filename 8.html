<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Common Box Styling */
        .box {
            width: 400px;
            padding: 25px;
            border: 5px solid rgb(244, 244, 247);
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background-color: white;
            text-align: center;
        }

        /* The Cat Box Styling */
        .box-cat img {
            width: 180px;
            border-radius: 10px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        p {
            color: #d81b60;
            font-weight: 500;
            margin-bottom: 15px;
        }

        button, .btn {
            background-color: rgb(119, 5, 75);
            color: white;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(119, 5, 75, 0.3);
        }

        button:hover, .btn:hover {
            background-color: rgb(150, 10, 90);
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(150, 10, 90, 0.4);
        }

        a { text-decoration: none; }
    </style>
</head>
