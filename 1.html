<!--html means giving instructions to your computer browser about how to display a webpage. It uses tags to structure content.-->
<!DOCTYPE html> 
<!--this is the document type declaration..it tells the browser this is an html5 document...it ensures that the browser renders your page in standards mode ..-->
<html lang="en">
    <!--Explanation: The <html> tag is the root element of the HTML document.

Everything on the page must be inside <html> ... </html>.

lang="en" specifies the language of the page (English in this case), which is important for accessibility and SEO.-->
<head>
    <!--Explanation: The <head> section contains meta-information about the document.

This includes things like the title, character set, links to CSS files, scripts, and SEO metadata.

Content inside <head> is not visible on the webpage itself.-->
	<meta charset="UTF-8">
    <!--Explanation: Sets the character encoding of the page to UTF-8.

UTF-8 supports almost all characters and symbols in the world, so your text will display correctly.-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!--Explanation: This is important for responsive web design.

width=device-width makes the page width equal to the device’s screen width.

initial-scale=1.0 sets the initial zoom level when the page loads.

Without this, your page might look zoomed out on mobile devices.-->
	<title>My Webpage</title>
     <!--Explanation: Sets the title of your webpage, which appears in the browser tab.

It’s also used by search engines as the title in search results.-->
</head>
<body>
<!--we use button to use button tag name : <button>the text we want to paste into button tag </button>-->
    <button>Click Me!</button>
    <!--Explanation: The <button> tag creates a clickable button on the webpage.-->
        <p>this is a paragraph tag used to print paragraph.</p>
    <!--Explanation: The <p> tag defines a paragraph of text.-->
        <!--understand the syntax-->
        <a href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube</a>
        <!--here href ="" inside double quotes we actually paste the link which we want to open and between a tag we use link name-->
        <!--a represents the anchor element/tag used to link another website -->
        <!--target link says where we want to open into current or new page  -->
</body>
</html>
